image: node:22.19.0-bookworm-slim

stages:
  - validate

validate:
  stage: validate
  script:
    - npm ci --ignore-scripts
    - npm --prefix app-template ci --ignore-scripts
    - npm run check
    - npm run score -- --static --app-dir app-template
    - npm run challenge -- --prepare-only
  artifacts:
    when: always
    paths:
      - artifacts/score.json
    expire_in: 1 week
